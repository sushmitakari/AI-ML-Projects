name: Predictive Maintenance ML Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Step 1 - Data Registration & Schema Validation
      run: |
        python src/data_registration.py data/engine_data.csv

    - name: Step 2 - Data Preparation & Train-Test Split
      run: |
        python src/data_preparation.py

    - name: Upload Data Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: data-splits
        path: |
          data/train.csv
          data/test.csv

    - name: Step 3 - Model Training, Tuning & Evaluation
      run: |
        python src/model_training.py

    - name: Upload Model Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: model-artifacts
        path: |
          models/best_model.pkl
          models/experiment_results.json
